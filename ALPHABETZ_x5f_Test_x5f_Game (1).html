<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ALPHABETZ PRESCHOOL - Test Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff7e6;height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:10px}
.header{background:#ff6b00;color:#fff;width:100%;text-align:center;padding:10px;border-radius:14px}
.header h1{font-size:20px;letter-spacing:1px}
.header p{font-size:12px;opacity:.9}
.display{background:#fff;border:4px solid #ff6b00;width:100%;height:220px;margin:12px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#bigLetter{font-size:110px;font-weight:900;color:#ff6b00;line-height:1}
#word{font-size:26px;font-weight:800;color:#222;margin-top:4px;text-transform:uppercase}
#hint{font-size:13px;color:#666;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%}
button{height:52px;border:none;border-radius:12px;background:#4a90e2;color:#fff;font-size:20px;font-weight:800;cursor:pointer}
button:active{transform:scale(.95)}
button.active{background:#ff6b00}
.footer{margin-top:12px;font-size:12px;color:#888;text-align:center}
</style>
</head>
<body>
<div class="header"><h1>ALPHABETZ PRESCHOOL</h1><p>TEST GAME • TAP A LETTER • LEARN & PLAY</p></div>
<div class="display"><div id="bigLetter">A</div><div id="word">APPLE</div><div id="hint">Tap any letter below 👇</div></div>
<div class="grid" id="grid"></div>
<div class="footer">Baburhat • Cooch Behar • Test Game for GitHub</div>
<script>
const data={A:"APPLE",B:"BALL",C:"CAT",D:"DOG",E:"ELEPHANT",F:"FISH",G:"GRAPES",H:"HEN",I:"ICE CREAM",J:"JUG",K:"KITE",L:"LION",M:"MANGO",N:"NEST",O:"ORANGE",P:"PARROT",Q:"QUEEN",R:"RABBIT",S:"SUN",T:"TIGER",U:"UMBRELLA",V:"VAN",W:"WATCH",X:"X-MAS TREE",Y:"YO-YO",Z:"ZEBRA"};
const grid=document.getElementById('grid');
Object.keys(data).forEach(l=>{
  const b=document.createElement('button'); b.textContent=l;
  b.onclick=()=>{
    document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('bigLetter').textContent=l;
    document.getElementById('word').textContent=data[l];
    try{ const u=new SpeechSynthesisUtterance(l+" for "+data[l]); u.rate=0.85; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){}
  };
  grid.appendChild(b);
});
</script>
</body>
</html>
